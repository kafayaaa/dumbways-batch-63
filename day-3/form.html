<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 3 - Form</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body
    class="container vh-100 d-flex flex-column justity-content-center align-items-center p-5"
  >
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-nav fixed-top">
      <div class="container">
        <a class="navbar-brand" href="#">
          <img
            src="https://dumbways.id/assets/images/brandred.png"
            alt="logo"
            height="40"
          />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">My Project</a>
            </li>
          </ul>
          <a
            href="form.html"
            class="btn fw-bold bg-black text-light"
            type="submit"
          >
            Contact Me
          </a>
        </div>
      </div>
    </nav>
    <!-- End Navbar -->

    <h1 class="py-5 fw-bold">GET IN TOUCH</h1>
    <form>
      <div class="mb-3">
        <label for="exampleInputName" class="form-label fw-bold">Name</label>
        <input
          type="text"
          class="form-control shadow"
          id="exampleInputEmail1"
          aria-describedby="nameHelp"
        />
      </div>
      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label fw-bold">Email</label>
        <input
          type="email"
          class="form-control shadow"
          id="exampleInputEmail1"
          aria-describedby="emailHelp"
        />
      </div>
      <div class="mb-3">
        <label for="exampleInputPhoneNumber1" class="form-label fw-bold"
          >Phone Number</label
        >
        <input
          type="text"
          class="form-control shadow"
          id="exampleInputPhoneNumber1"
        />
      </div>
      <div class="mb-3">
        <label for="exampleSelect1" class="form-label fw-bold">Subject</label>
        <select class="form-select" id="exampleSelect1">
          <option selected>Choose...</option>
          <option value="1">One</option>
          <option value="2">Two</option>
          <option value="3">Three</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="exampleFormControlTextarea1" class="form-label fw-bold"
          >Your Message</label
        >
        <textarea
          class="form-control shadow"
          id="exampleFormControlTextarea1"
          rows="5"
        ></textarea>
      </div>
      <div class="d-flex justify-content-end mt-5">
        <button
          type="submit"
          class="btn bg-black text-light fw-bold rounded-5 px-4 py-2"
        >
          submit
        </button>
      </div>
    </form>
  </body>
</html>
